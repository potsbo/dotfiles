approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[tui]
# terminal title にタスク内容 (thread-title) を出す。default は activity + project-name で
# worktree 名しか出ず、herdr sidebar の terminal_title_stripped 行が機能しないため。
# project-name は herdr の workspace トークンと重複するので入れない。
# thread-title 未生成の間は title を書き換えない (直前の title が残る)。
terminal_title = ["activity", "thread-title"]

[projects."/home/potsbo/src/github.com/medicu-inc/one"]
trust_level = "trusted"

[projects."/home/potsbo/src/github.com/potsbo/dotfiles"]
trust_level = "trusted"
