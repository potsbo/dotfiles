# 通知や MCP/marketplace の一時的な実行パスはマシン間で共有できないため含めない。
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[tui]
# Rex で Shift なしの文字選択・コピーを使えるよう、通常画面で起動する。
alternate_screen = "never"
# terminal title にタスク内容 (thread-title) を出す。default は activity + project-name で
# worktree 名しか出ず、何のタスクか分からないため。
# thread-title 未生成の間は title を書き換えない (直前の title が残る)。
# activity (title 先頭の spinner) は入れない。動作中かどうかは OSC 7501 で Rex に渡り、
# Rex がタブに spinner を出す。Claude Code は OSC 7501 対応の端末では title の spinner を
# 出さないので、Codex だけ title でも回ると見え方が揃わない。
terminal_title = ["thread-title"]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[features]
hooks = true

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_PROSE"

# 信頼設定は ~ が展開されず絶対パスで照合されるため、OS ごとのパスを保存する。
# 一致しない項目は使われないので、復元のために独自の変換処理を持つ必要はない。
[projects."/Users/potsbo/src/github.com/potsbo/dotfiles"]
trust_level = "trusted"

[projects."/home/potsbo/src/github.com/potsbo/dotfiles"]
trust_level = "trusted"

[projects."/home/potsbo/src/github.com/medicu-inc/one"]
