# docs/keymap.md の A3 (Cmd+Tab で直近のアプリへ)。常駐は modules/nixos/desktop/niri.nix、
# 呼び出しは home/.config/niri/user.kdl の Mod+Tab。
#
# 仕様はアプリ単位が原則だが、niriswitcher が持つのはウィンドウ単位の MRU だけ。
# niri 内蔵の recent-windows も同じなので、実装を替えても妥協の度合いは変わらない。

# ワークスペースごとに分けず、全ウィンドウを 1 列の MRU で出す。macOS の Cmd+Tab は
# デスクトップをまたいで全アプリが並ぶので、それに合わせる。分けると「隣の画面に出した
# アプリに Cmd+Tab で戻れない」という、探しにくさの元の問題がそのまま残る。
separate_workspaces = false
current_output_only = false

[keys]
# 物理 Cmd。xremap は Super をそのまま通す (docs/keymap.md §2)。
modifier = "super"

[appearance]
# 既定の 128 は 4K でもかなり大きい。一覧全部が視野に入る方を取る。
icon_size = 96
system_theme = "auto"
