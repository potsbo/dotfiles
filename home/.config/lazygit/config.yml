gui:
  theme:
    activeBorderColor:
      - "#ae81ff"
      - bold
    inactiveBorderColor:
      - "#75715e"
    optionsTextColor:
      - "#ae81ff"
    selectedLineBgColor:
      - "#5c5a50"
    cherryPickedCommitBgColor:
      - "#5c5a50"
    cherryPickedCommitFgColor:
      - "#a6e22e"
    unstagedChangesColor:
      - "#f92672"
    defaultFgColor:
      - "#f8f8f2"
    searchingActiveBorderColor:
      - "#e6db74"
git:
  branchPrefix: "potsbo/"
  pagers:
    - colorArg: always
      pager: hunk pager
os:
  # SSH セッションでは wl-copy 等が使えないので OSC52 でターミナル経由コピー
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w0)\a" > /dev/tty
# hunk へ即復帰したいので「press enter to return」を挟まない
promptToReturnFromSubprocess: false
customCommands:
  # 別ペインの hunk セッションがあればそれを切り替え、無ければフルスクリーンで開く
  - key: <enter>
    context: commits, subCommits
    description: Show commit in hunk
    command: hunk session reload --repo . -- show {{.SelectedCommit.Hash}} 2>/dev/null || hunk show {{.SelectedCommit.Hash}}
    output: terminal
keybinding:
  universal:
    prevItem-alt: t
    nextItem-alt: h
    prevBlock-alt: d
    nextBlock-alt: n
    remove: j
    new: l
