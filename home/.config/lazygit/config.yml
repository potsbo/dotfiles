gui:
  theme:
    activeBorderColor:
      - "#ae81ff"
      - bold
    inactiveBorderColor:
      - "#75715e"
    optionsTextColor:
      - "#ae81ff"
    selectedLineBgColor:
      - "#5c5a50"
    cherryPickedCommitBgColor:
      - "#5c5a50"
    cherryPickedCommitFgColor:
      - "#a6e22e"
    unstagedChangesColor:
      - "#f92672"
    defaultFgColor:
      - "#f8f8f2"
    searchingActiveBorderColor:
      - "#e6db74"
git:
  branchPrefix: "potsbo/"
  pagers:
    - colorArg: always
      pager: hunk pager
os:
  # SSH セッションでは wl-copy 等が使えないので OSC52 でターミナル経由コピー
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w0)\a" > /dev/tty
customCommands:
  # 隣のペインで hunk が開いていればそれを選択中コミットに切り替える
  - key: <enter>
    context: commits, subCommits
    description: Show commit in live hunk pane
    command: hunk session reload --repo . -- show {{.SelectedCommit.Hash}}
    output: none
  - key: U
    context: commits, subCommits
    description: Open commit in hunk (fullscreen)
    command: hunk show {{.SelectedCommit.Hash}}
    output: terminal
keybinding:
  universal:
    prevItem-alt: t
    nextItem-alt: h
    prevBlock-alt: d
    nextBlock-alt: n
    remove: j
    new: l
