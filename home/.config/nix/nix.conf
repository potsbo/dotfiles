# GitHub API の未認証レート制限 (60 req/hour) を避けるためのトークンを読み込む。
# 実体は install が gh から生成する untracked ファイルなので、
# 未生成でもエラーにならないよう ! 付きの include を使う。
!include access-tokens.conf

# NixOS 以外 (macOS、管理外 Linux) で flakes を有効にする。NixOS は common.nix が
# /etc/nix/nix.conf に書く。公式インストーラはこれを有効にしない。
experimental-features = nix-command flakes
