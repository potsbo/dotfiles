packages:
  # macmon - CPU/GPU temperature, power and frequency monitor for Apple Silicon.
  # https://github.com/vladkens/macmon
  # Single universal arm64 asset, so darwin/arm64 only.
  - type: github_release
    repo_owner: vladkens
    repo_name: macmon
    asset: macmon-{{.Version}}.tar.gz
    supported_envs:
      - darwin/arm64
    files:
      - name: macmon
  # ghui - A GitHub TUI. https://github.com/kitlangton/ghui
  - type: github_release
    repo_owner: kitlangton
    repo_name: ghui
    asset: ghui-{{.OS}}-{{.Arch}}.tar.gz
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: ghui
  # ax - The AI-era curl. https://github.com/yusukebe/ax
  - type: github_release
    repo_owner: yusukebe
    repo_name: ax
    asset: ax-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: ax
  # terminal-browser - Chromium (Electron) を端末内にオフスクリーン描画するブラウザ。
  # https://github.com/zenbu-labs/terminal-browser
  # 公式は brew か curl | bash だが、GitHub release に tarball があるので aqua で入れる。
  # bin/terminal-browser は同梱 Electron を相対パスで exec する wrapper なので
  # tarball の展開構造をそのまま使う。NixOS では Electron のシステムライブラリを
  # nix-ld 側で用意している (modules/nixos/common.nix)。
  - type: github_release
    repo_owner: zenbu-labs
    repo_name: terminal-browser
    asset: terminal-browser-{{.OS}}-{{.Arch}}.tar.gz
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: terminal-browser
        src: terminal-browser/bin/terminal-browser
