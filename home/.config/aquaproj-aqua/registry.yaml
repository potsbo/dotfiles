packages:
  # macmon - CPU/GPU temperature, power and frequency monitor for Apple Silicon.
  # https://github.com/vladkens/macmon
  # Single arm64 asset, so darwin/arm64 only.
  - type: github_release
    repo_owner: vladkens
    repo_name: macmon
    asset: macmon-{{.Version}}-aarch64-apple-darwin.tar.gz
    version_constraint: semver(">= 0.11.0")
    version_overrides:
      - version_constraint: "true"
        asset: macmon-{{.Version}}.tar.gz
    supported_envs:
      - darwin/arm64
    files:
      - name: macmon
  # ghui - A GitHub TUI. https://github.com/kitlangton/ghui
  - type: github_release
    repo_owner: kitlangton
    repo_name: ghui
    asset: ghui-{{.OS}}-{{.Arch}}.tar.gz
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: ghui
  # ax - The AI-era curl. https://github.com/yusukebe/ax
  - type: github_release
    repo_owner: yusukebe
    repo_name: ax
    asset: ax-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: ax
  # neorex - Rex の pane を Neovim の window として使う Neovim frontend。
  # https://github.com/alexrlocke/neorex
  # upstream flake もあるが Zig からの source build になる。release の tarball は
  # 静的リンクで NixOS でもそのまま動くので aqua で入れる。
  - type: github_release
    repo_owner: alexrlocke
    repo_name: neorex
    asset: neorex-{{.Arch}}-{{.OS}}.tar.gz
    replacements:
      darwin: macos
      amd64: x86_64
      arm64: aarch64
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
    files:
      - name: neorex
        src: "{{.AssetWithoutExt}}/bin/neorex"
  # desync - casync 互換の content-addressed chunk store (cascp が使う)。
  # https://github.com/folbricht/desync
  # standard registry にもあるが rosetta2: true で、Apple Silicon でも amd64 版を
  # Rosetta 経由で入れる。v1.1.4 には darwin_arm64 の asset があるのでこちらで定義し直す。
  # standard 側が直ったらこの定義と aqua.yaml の `registry: local` を消す。
  - type: github_release
    repo_owner: folbricht
    repo_name: desync
    asset: desync_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
    files:
      - name: desync
  # tuicr - TUI で diff をレビューし、コメントを AI エージェントに渡す。
  # https://github.com/agavra/tuicr
  # standard registry に無いのでここで定義する。release に checksum ファイルは無い。
  # Linux は glibc 非依存の musl 版を使う。
  - type: github_release
    repo_owner: agavra
    repo_name: tuicr
    asset: tuicr-{{trimV .Version}}-{{.Arch}}-{{.OS}}.tar.gz
    replacements:
      darwin: apple-darwin
      linux: unknown-linux-musl
      amd64: x86_64
      arm64: aarch64
    supported_envs:
      - darwin
      - linux
    files:
      - name: tuicr
  # fastfetch - aqua-registry に定義はあるが、2.71.0 で macOS の asset が universal だけに
  # なったのに追従しておらず (v4.585.0 時点)、Renovate の PR が checksum 更新で落ち続けた。
  # 標準 registry が直ったら aqua.yaml の registry: local を外してこの定義を消す。
  - type: github_release
    repo_owner: fastfetch-cli
    repo_name: fastfetch
    asset: fastfetch-{{.OS}}-{{.Arch}}.tar.gz
    replacements:
      darwin: macos
      arm64: aarch64
    overrides:
      - goos: darwin
        asset: fastfetch-macos-universal.tar.gz
    supported_envs:
      - darwin
      - linux
    files:
      - name: fastfetch
        src: "{{.AssetWithoutExt}}/usr/bin/fastfetch"
  # leaf - 論文・ドキュメント・diff・PR を読む TUI。選択箇所をエージェントに渡せる。
  # https://github.com/DeepanshuMishraa/leaf
  # standard registry に無いのでここで定義する。Linux 版は glibc 動的リンクで
  # libasound を要求するので、NixOS では nix-ld.libraries に alsa-lib を入れてある。
  - type: github_release
    repo_owner: DeepanshuMishraa
    repo_name: leaf
    asset: leaf-{{.Arch}}-{{.OS}}.tar.gz
    replacements:
      darwin: apple-darwin
      linux: unknown-linux-gnu
      amd64: x86_64
      arm64: aarch64
    checksum:
      type: github_release
      asset: SHA256SUMS
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
    files:
      - name: leaf
  # krd - SSH 越しに macOS のデスクトップを kitty graphics で pane に映して操作する。
  # https://github.com/zzjcool/krd
  # upstream の install.sh は手元の Apple Development 証明書で署名し直して ~/bin に置く。
  # 署名が効くのは TCC の許可を krd 自身に付けたとき (launchd から起動する場合) だけで、
  # ssh 越しなら許可は /usr/libexec/sshd-keygen-wrapper が受けるので (upstream
  # docs/DEPLOY.md §3)、release の linker 署名のままバージョンごとのパスに置いて困らない。
  # install.sh が足す `wall` symlink は入れない。macOS にも /usr/bin/wall があって隠れる。
  - type: github_release
    repo_owner: zzjcool
    repo_name: krd
    asset: krd-{{.Version}}-macos-universal.tar.gz
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    supported_envs:
      - darwin
    files:
      - name: krd
        src: "{{.AssetWithoutExt}}/krd"
