packages:
  # macmon - CPU/GPU temperature, power and frequency monitor for Apple Silicon.
  # https://github.com/vladkens/macmon
  # Single universal arm64 asset, so darwin/arm64 only.
  - type: github_release
    repo_owner: vladkens
    repo_name: macmon
    asset: macmon-{{.Version}}.tar.gz
    supported_envs:
      - darwin/arm64
    files:
      - name: macmon
  # ghui - A GitHub TUI. https://github.com/kitlangton/ghui
  - type: github_release
    repo_owner: kitlangton
    repo_name: ghui
    asset: ghui-{{.OS}}-{{.Arch}}.tar.gz
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: ghui
  # ax - The AI-era curl. https://github.com/yusukebe/ax
  - type: github_release
    repo_owner: yusukebe
    repo_name: ax
    asset: ax-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: ax
  # terminal-browser - Chromium (Electron) を端末内にオフスクリーン描画するブラウザ。
  # https://github.com/zenbu-labs/terminal-browser
  # 公式は brew か curl | bash だが、GitHub release に tarball があるので aqua で入れる。
  # bin/terminal-browser は同梱 Electron を相対パスで exec する wrapper なので
  # tarball の展開構造をそのまま使う。NixOS では Electron のシステムライブラリを
  # nix-ld 側で用意している (modules/nixos/common.nix)。
  - type: github_release
    repo_owner: zenbu-labs
    repo_name: terminal-browser
    asset: terminal-browser-{{.OS}}-{{.Arch}}.tar.gz
    replacements:
      amd64: x64
    supported_envs:
      - darwin
      - linux
    files:
      - name: terminal-browser
        src: terminal-browser/bin/terminal-browser
  # neorex - Rex の pane を Neovim の window として使う Neovim frontend。
  # https://github.com/alexrlocke/neorex
  # upstream flake もあるが Zig からの source build になる。release の tarball は
  # 静的リンクで NixOS でもそのまま動くので aqua で入れる。
  - type: github_release
    repo_owner: alexrlocke
    repo_name: neorex
    asset: neorex-{{.Arch}}-{{.OS}}.tar.gz
    replacements:
      darwin: macos
      amd64: x86_64
      arm64: aarch64
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
    files:
      - name: neorex
        src: "{{.AssetWithoutExt}}/bin/neorex"
  # desync - casync 互換の content-addressed chunk store (cascp が使う)。
  # https://github.com/folbricht/desync
  # standard registry にもあるが rosetta2: true で、Apple Silicon でも amd64 版を
  # Rosetta 経由で入れる。v1.1.4 には darwin_arm64 の asset があるのでこちらで定義し直す。
  # standard 側が直ったらこの定義と aqua.yaml の `registry: local` を消す。
  - type: github_release
    repo_owner: folbricht
    repo_name: desync
    asset: desync_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
    files:
      - name: desync
  # tuicr - TUI で diff をレビューし、コメントを AI エージェントに渡す。
  # https://github.com/agavra/tuicr
  # standard registry に無いのでここで定義する。release に checksum ファイルは無い。
  # Linux は glibc 非依存の musl 版を使う。
  - type: github_release
    repo_owner: agavra
    repo_name: tuicr
    asset: tuicr-{{trimV .Version}}-{{.Arch}}-{{.OS}}.tar.gz
    replacements:
      darwin: apple-darwin
      linux: unknown-linux-musl
      amd64: x86_64
      arm64: aarch64
    supported_envs:
      - darwin
      - linux
    files:
      - name: tuicr
