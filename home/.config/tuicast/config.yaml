# 共通ピッカー: herdr の中 (ctrl+] → herdr keybind) からも外 (zsh の C-]) からも
# 同じ tuicast を呼ぶ。内外差は各 run スクリプト側で HERDR_ENV を見て
# 切り替える (worktree-connect.sh / ssh-connect.sh)。
views:
  main:
    union:
      - herdr
      - zsh
      - lazygit
      - hunk
      - hunk-show
      - ghui
      - yazi
      - nvim
      - glow
      - btop
      # union は設定順に直列実行されるので、重い source ほど後ろに置く。
      # ssh は即時 (~0.1s)、open worktree は herdr 呼び出しで ~0.3s、closed の
      # 列挙は全 ghq repo を舐めて ~1s。
      - ssh
      - worktree
      - worktree-closed

  # herdr の外にいるときだけ出る「herdr に入る」エントリ。
  # attach は herdr-attach 経由 (ssh detach-and-reconnect ループ付き)。
  herdr:
    steps:
      - name: _herdr
        sources:
          - list: '[ -z "${HERDR_ENV:-}" ] && command -v herdr >/dev/null && echo herdr || true'
            display: "printf '\\033[38;2;255;199;153m\\357\\222\\211\\033[39m %s\\n' {}"
    run: ~/.local/bin/herdr-attach

  # git リポジトリ内にいるときだけ出る lazygit エントリ。選んで抜けたら popup/pane が閉じる。
  # 色は worktree の working と同じ peach 系に合わせ、アイコンは git branch (\356\202\240)。
  lazygit:
    steps:
      - name: _lazygit
        sources:
          - list: "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && command -v lazygit >/dev/null && echo lazygit || true"
            display: "printf '\\033[38;2;255;199;153m\\356\\202\\240\\033[39m %s\\n' {}"
    run: lazygit

  # working tree の diff を hunk でレビュー。git リポジトリ内かつ hunk がある場合のみ。
  # 色は lazygit と区別して blue 系、アイコンは code-fork (\357\204\246)。
  hunk:
    steps:
      - name: _hunk
        sources:
          - list: 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && command -v hunk >/dev/null && echo "hunk diff" || true'
            display: "printf '\\033[38;2;153;204;255m\\357\\204\\246\\033[39m %s\\n' {}"
    run: hunk diff

  # 直近コミットを hunk でレビュー (hunk show)。git リポジトリ内かつ hunk がある場合のみ。
  # hunk diff と区別して lavender、アイコンは history (\357\207\232)。
  hunk-show:
    steps:
      - name: _hunk_show
        sources:
          - list: 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && command -v hunk >/dev/null && echo "hunk show" || true'
            display: "printf '\\033[38;2;180;170;255m\\357\\207\\232\\033[39m %s\\n' {}"
    run: hunk show

  # GitHub の PR/issue を見る TUI (ghui)。どこでも出せるよう無条件 (ghui がある場合のみ)。
  # 色は GitHub らしい purple、アイコンは github (\357\202\233)。
  ghui:
    steps:
      - name: _ghui
        sources:
          - list: "command -v ghui >/dev/null && echo ghui || true"
            display: "printf '\\033[38;2;190;140;250m\\357\\202\\233\\033[39m %s\\n' {}"
    run: ghui

  # ファイラ。どこでも出せるよう無条件 (yazi がある場合のみ)。
  # 色は folder らしい yellow、アイコンは folder (\357\201\273)。
  yazi:
    steps:
      - name: _yazi
        sources:
          - list: "command -v yazi >/dev/null && echo yazi || true"
            display: "printf '\\033[38;2;255;213;128m\\357\\201\\273\\033[39m %s\\n' {}"
    run: yazi

  # エディタ。どこでも出せるよう無条件 (nvim がある場合のみ)。
  # 色は neovim らしい green、アイコンは vim (\356\230\253)。
  nvim:
    steps:
      - name: _nvim
        sources:
          - list: "command -v nvim >/dev/null && echo nvim || true"
            display: "printf '\\033[38;2;138;192;120m\\356\\230\\253\\033[39m %s\\n' {}"
    run: nvim

  # cwd 配下の Markdown をブラウズする TUI (glow)。無条件 (glow がある場合のみ)。
  # 色は glow らしい pink、アイコンは book (\357\200\255)。
  glow:
    steps:
      - name: _glow
        sources:
          - list: "command -v glow >/dev/null && echo glow || true"
            display: "printf '\\033[38;2;245;160;210m\\357\\200\\255\\033[39m %s\\n' {}"
    run: glow

  # システムモニタ。どこにいても出せるよう無条件 (btop がある場合のみ)。
  # 色は idle と同じ mint 系、アイコンは bar chart (\357\202\200)。
  btop:
    steps:
      - name: _btop
        sources:
          - list: "command -v btop >/dev/null && echo btop || true"
            display: "printf '\\033[38;2;153;255;228m\\357\\202\\200\\033[39m %s\\n' {}"
    run: btop

  # スクラッチシェル。ツールごとに増やさず、素の zsh を1つ出す入口。exit で閉じる。
  # 色は控えめな grey、アイコンは terminal (\357\204\240)。
  zsh:
    steps:
      - name: _zsh
        sources:
          - list: "command -v zsh >/dev/null && echo zsh || true"
            display: "printf '\\033[38;2;180;180;180m\\357\\204\\240\\033[39m %s\\n' {}"
    run: zsh

  # 開いている space がある worktree、緊急なもの (blocked) が先頭。並び順は
  # list 側、行ごとのドット (herdr の状態色)・ラベル・branch は display filter
  # (worktree-label.sh) の担当。かつては状態ごとに 4 source に分けて static な
  # ドットを塗っていたが、source ごとに herdr RPC (~50ms) を払うのをやめて
  # 1 source に統合した。pipe 形式 ("|") なのは per-item だと spawn コストが
  # 支配的になるため (詳細はスクリプト冒頭)。
  worktree:
    steps:
      - name: worktree
        sources:
          - list: ~/.config/tuicast/list-worktrees.sh --open
            display: "|~/.config/tuicast/worktree-label.sh --dot open"
            preview: git -C {} log --oneline --decorate -15 2>/dev/null
    run: ~/.config/tuicast/worktree-connect.sh $worktree

  # 開いていない worktree。worktree view と別なのは union での表示優先度の
  # ため (union の comment 参照)。
  worktree-closed:
    steps:
      - name: worktree
        sources:
          - list: ~/.config/tuicast/list-worktrees.sh --closed
            display: "|~/.config/tuicast/worktree-label.sh --dot none"
            preview: git -C {} log --oneline --decorate -15 2>/dev/null
    run: ~/.config/tuicast/worktree-connect.sh $worktree

  ssh:
    steps:
      - name: host
        sources:
          - list: ~/.config/tuicast/list-ssh-hosts.sh
            display: ~/.config/tuicast/ssh-display.sh {}
            preview: ssh -G {} 2>/dev/null | grep -iE '^(hostname|user|port|identityfile) '
    run: ~/.config/tuicast/ssh-connect.sh $host
