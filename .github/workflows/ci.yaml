name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.57.1
      - run: ./install
      - run: aqua install

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix build .#homeConfigurations.linux.activationPackage

  # NixOS ホストは build せず eval だけする (closure の build は重い)。
  # hardware-configuration.nix を repo に持つ pure なホストしか CI では評価できない。
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [phoenix, raptorlake]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix eval --raw .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
