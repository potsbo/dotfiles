name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ./install は potsbo 専用で runner では動かせないので、aqua.yaml の検証だけ行う。
  aqua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.57.1
      - run: aqua install
        env:
          AQUA_CONFIG: ${{ github.workspace }}/home/.config/aquaproj-aqua/aqua.yaml
          AQUA_POLICY_CONFIG: ${{ github.workspace }}/home/.config/aquaproj-aqua/aqua-policy.yaml

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix build .#nixosConfigurations.phoenix.config.home-manager.users.potsbo.home.activationPackage

  # NixOS ホストは build せず eval だけする (closure の build は重い)。
  # hardware-configuration.nix を repo に持つ pure なホストしか CI では評価できない。
  nixos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [phoenix, raptorlake]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix eval --raw .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
